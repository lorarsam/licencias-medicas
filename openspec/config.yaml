schema: spec-driven

context: |
  Tech stack: Python 3.14, Django 6.1, JSON (no database)
  Framework: ES1 INACAP - Programacion Back End
  Domain: Gestion y validacion de licencias medicas en empresas chilenas
  Language: Spanish (Chile)
  Rules:
    - Must comply with ES1 rubric (30 points)
    - No hardcoded values - use constants
    - View imports from solucion.py (no logic duplication)
    - 4 decision results: 1 acceptance, 2 rejections, 1 invalid data
    - Chilean labor law for license types and max days

